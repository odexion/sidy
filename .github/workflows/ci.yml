name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Liquid glass needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: ./build.sh
